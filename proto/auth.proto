syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";

package auth;

service AuthService {
    // mail
	rpc RegisterMail(RegisterMailDto) returns (Tokens) {}
	rpc LoginMail(LoginMailDto) returns (Tokens) {}
	rpc AddMailCredential(AddMailCredDto) returns (google.protobuf.Empty) {}
	rpc UpdateMailPassword(UpdateMailPasswordDto) returns (google.protobuf.Empty) {}
    // google
	rpc RegisterOrLoginGoogle(RegisterOrLoginGoogleDto) returns (Tokens) {}
	rpc AddGoogleCredential(AddGoogleCredDto) returns (google.protobuf.Empty) {}
    // creds
	rpc GetCredentials(GetCredsDto) returns (Credentials) {}
	rpc RemoveCredential(RemoveCredDto) returns (google.protobuf.Empty) {}
    // common
	rpc Refresh(RefreshDto) returns (Tokens) {}
	rpc ValidateRefresh(ValidateRefreshDto) returns (Claims) {}
	rpc ValidateAccess(ValidateAccessDto) returns (google.protobuf.Empty) {}
	rpc LogOutAll(LogOutAllDto) returns (google.protobuf.Empty) {}
    // roles
	rpc GetRoleList(google.protobuf.Empty) returns (RoleList) {}
	rpc GetPermList(google.protobuf.Empty) returns (PermList) {}
	rpc AssignRoleTo(AssignRoleToDto) returns (google.protobuf.Empty) {}
	rpc RemoveRoleFrom(RemoveRoleFromDto) returns (google.protobuf.Empty) {}
    // identity
	rpc UpdateIdentity(UpdateIdentityDto) returns (google.protobuf.Empty) {}
    // lock
	rpc LockIdentity(LockIdentityDto) returns (google.protobuf.Empty) {}
	rpc UnlockIdentity(UnlockIdentityDto) returns (google.protobuf.Empty) {}
    // google calendar
	rpc ConnectGoogleCalendar(ConnectGoogleCalendarDto) returns (GoogleCalendarConnection) {}
	rpc DisconnectGoogleCalendar(DisconnectGoogleCalendarDto) returns (google.protobuf.Empty) {}
	rpc GetGoogleCalendarToken(GetGoogleCalendarTokenDto) returns (GoogleCalendarAccessToken) {}
	rpc RefreshGoogleCalendarToken(RefreshGoogleCalendarTokenDto) returns (GoogleCalendarAccessToken) {}
    // qol
	rpc FindIdentityIds(FindIdentityIdsDto) returns (IdentityIds){}
	rpc FindIdentities(FindIdentitiesDto) returns (Identities) {}
	rpc FindIdentitiesByPhone(FindIdentitiesByPhoneDto) returns (Identities) {}
	rpc HydrateIdentities(HydrateIdentitiesDto) returns (HydratedIdentities) {}
	rpc HydrateIdentity(HydrateIdentityDto) returns (HydratedIdentities.HydratedIdentity) {}
}

// Request
message RegisterMailDto {
	google.protobuf.StringValue username = 1;
	google.protobuf.StringValue mail     = 2;
	google.protobuf.StringValue password = 3;
}

message LoginMailDto {
	google.protobuf.StringValue mail     = 1;
	google.protobuf.StringValue password = 2;
}

message AddMailCredDto {
	google.protobuf.StringValue identity_id = 1;
	google.protobuf.StringValue mail        = 2;
	google.protobuf.StringValue password    = 3;
}

message UpdateMailPasswordDto {
	google.protobuf.StringValue identity_id = 1;
	google.protobuf.StringValue id          = 2;
	google.protobuf.StringValue password    = 3;
	google.protobuf.StringValue current_password = 4;
}

message RegisterOrLoginGoogleDto {
	google.protobuf.StringValue identifier = 1;
	// fallback username when no usable one can be derived from the email
	google.protobuf.StringValue username   = 2;
	// Google profile display name; becomes the full name of a new account
	optional google.protobuf.StringValue full_name  = 3;
	// Google account email; a new account's username is derived from its local part
	optional google.protobuf.StringValue email      = 4;
}

message AddGoogleCredDto {
	google.protobuf.StringValue identity_id = 1;
	google.protobuf.StringValue identifier  = 2;
}

message GetCredsDto {
	google.protobuf.StringValue identity_id = 1;
}

message RemoveCredDto {
	google.protobuf.StringValue identity_id = 1;
	google.protobuf.StringValue id          = 2;
}

message RefreshDto {
	google.protobuf.StringValue identity_id = 1;
}

message ValidateRefreshDto {
	google.protobuf.StringValue identity_id = 1;
	google.protobuf.Int32Value  iat         = 2;
	google.protobuf.DoubleValue iat_ms      = 3;
}

message ValidateAccessDto {
	google.protobuf.StringValue identity_id = 1;
	google.protobuf.Int32Value  iat         = 2;
	google.protobuf.DoubleValue iat_ms      = 3;
}

message LogOutAllDto {
	google.protobuf.StringValue identity_id = 1;
}

message UpdateIdentityDto {
	google.protobuf.StringValue          identity_id            = 1;
	optional google.protobuf.StringValue username               = 2;
	optional google.protobuf.StringValue full_name              = 3;
	optional google.protobuf.BoolValue   set_full_name_null     = 4;
	optional google.protobuf.StringValue bio                    = 5;
	optional google.protobuf.BoolValue   set_bio_null           = 6;
	optional google.protobuf.StringValue avatar_id              = 7;
	optional google.protobuf.BoolValue   set_avatar_id_null     = 8;
	optional google.protobuf.StringValue phone_number           = 9;
	optional google.protobuf.BoolValue   set_phone_number_null  = 10;
}

message AssignRoleToDto {
	google.protobuf.StringValue role_id     = 1;
	google.protobuf.StringValue identity_id = 2;
}

message RemoveRoleFromDto {
	google.protobuf.StringValue role_id     = 1;
	google.protobuf.StringValue identity_id = 2;
}

message FindIdentityIdsDto {
	optional google.protobuf.StringValue username_or_cred_identifier = 1;
	optional google.protobuf.StringValue cursor                      = 2;
	optional google.protobuf.Int32Value  limit                       = 3;
	// Match usernames only (no credential identifiers such as emails); set for public searches.
	optional google.protobuf.BoolValue   username_only               = 4;
}

message FindIdentitiesDto {
	optional google.protobuf.StringValue username_or_cred_identifier_or_id = 1;
	repeated google.protobuf.StringValue has_roles                         = 2;
	repeated google.protobuf.StringValue has_perms                         = 3;
	optional google.protobuf.StringValue cursor                            = 4;
	optional google.protobuf.Int32Value  limit                             = 5;
	// Match usernames only (no credential identifiers/ids); set for public searches.
	optional google.protobuf.BoolValue   username_only                     = 6;
}

message HydrateIdentitiesDto {
	repeated google.protobuf.StringValue identity_ids = 1;
}

message HydrateIdentityDto {
	google.protobuf.StringValue identity_id = 1;
}

// Response
message Tokens {
	string          access_token  = 1;
	optional string refresh_token = 2;
}

message Identity {
	string          id       = 1;
	string          username = 2;
	repeated string roles    = 3;
	optional string phone_number = 4;
	bool            is_locked    = 5;
}

message Role {
	string          id          = 1;
	string          name        = 2;
	repeated string permissions = 3;
}

message Claims {
	string          sub         = 1;
	repeated string roles       = 2;
	repeated string permissions = 3;
}

message RoleList {
	repeated Role roles = 1;
}

message PermList {
	repeated string perms = 1;
}

message IdentityIds {
	repeated string ids          = 1;
	string          next_cursor  = 2;
	string          prev_cursor  = 3;
}

message Identities {
	repeated Identity identities  = 1;
	string            next_cursor = 2;
	string            prev_cursor = 3;

	message Identity {
		string          id          = 1;
		string          username    = 2;
		optional string full_name   = 3;
		optional string bio         = 4;
		optional string avatar_url  = 5;
		repeated string roles       = 6;
		repeated string permissions = 7;
		optional string phone_number = 8;
		bool            is_locked    = 9;
	}
}

message HydratedIdentities {
	repeated HydratedIdentity identities = 1;

	message HydratedIdentity {
		string          id         = 1;
		string          username   = 2;
		optional string full_name  = 3;
		optional string bio        = 4;
		optional string avatar_url = 5;
		optional string phone_number = 6;
		repeated string roles      = 7;
		bool            is_demo    = 8;
	}
}

message Credentials {
	repeated Credential credentials = 1;

	message Credential {
		string id   = 1;
		string type = 2;
		// the email address of a MAIL credential; unset for other types
		optional google.protobuf.StringValue mail = 3;
	}
}

// Lock/Unlock
message LockIdentityDto {
	google.protobuf.StringValue identity_id = 1;
	google.protobuf.StringValue locked_by   = 2;
}

message UnlockIdentityDto {
	google.protobuf.StringValue identity_id = 1;
}

// Phone search
message FindIdentitiesByPhoneDto {
	google.protobuf.StringValue phone_number = 1;
	optional google.protobuf.StringValue cursor = 2;
	optional google.protobuf.Int32Value  limit  = 3;
}

// Google Calendar
message ConnectGoogleCalendarDto {
	google.protobuf.StringValue identity_id   = 1;
	google.protobuf.StringValue access_token  = 2;
	google.protobuf.StringValue refresh_token = 3;
	google.protobuf.Int64Value  expires_at    = 4;
	google.protobuf.StringValue scopes        = 5;
}

message DisconnectGoogleCalendarDto {
	google.protobuf.StringValue identity_id = 1;
}

message GetGoogleCalendarTokenDto {
	google.protobuf.StringValue identity_id = 1;
}

message RefreshGoogleCalendarTokenDto {
	google.protobuf.StringValue identity_id = 1;
}

// Never carries the refresh token: auth keeps it server-side.
message GoogleCalendarAccessToken {
	string access_token = 1;
	int64  expires_at   = 2;
}

message GoogleCalendarConnection {
	bool  connected  = 1;
	int64 expires_at = 2;
}

// Deprecated: no RPC returns this any more (it exposed the refresh token).
message GoogleCalendarTokenResponse {
	string access_token  = 1;
	string refresh_token = 2;
	int64  expires_at    = 3;
	string scopes        = 4;
}
