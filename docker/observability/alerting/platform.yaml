                        'expr': 'max by (service) (service_ready)',
                        'instant': true,
                        'intervalMs': 1000,
                        'maxDataPoints': 43200,
                      },
                  },
                  {
                    'refId': 'B',
                    'datasourceUid': '__expr__',
