services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    user: ${POSTGRES_USER:-postgres}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-englishdb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-12345}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -d $${POSTGRES_DB:-englishdb} -U $${POSTGRES_USER:-postgres}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - api-network
    volumes:
      # postgres 18+ images keep data under /var/lib/postgresql/<major>; mounting
      # .../data (pre-18 layout) makes the container crash-loop.
      - postgresql-data:/var/lib/postgresql
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro

  redis:
    image: redis/redis-stack:7.4.0-v8
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
      - "${REDIS_INSIGHT_PORT:-8002}:8001"
    networks:
      - api-network
    volumes:
      - redis-data:/data

  adminer:
    image: adminer:5.4.2
    restart: unless-stopped
    ports:
      - ${ADMINER_PORT:-8090}:8080
    networks:
      - api-network

  min-io:
    # upstream minio/minio images are no longer published; pgsty/minio is a
    # maintained drop-in build of the same server.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - api-network

  rabbit-mq:
    image: rabbitmq:4.2-management-alpine
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MNGMNT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-password}
    volumes:
      - rabbitmq_data:/data
      # Enables the Prometheus endpoint (:15692) scraped by the observability collector.
      # Takes effect when the container is recreated.
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks:
      - api-network

networks:
  api-network:
    driver: bridge

volumes:
  postgresql-data:
  redis-data:
  minio-data:
  rabbitmq_data:
