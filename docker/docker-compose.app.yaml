services:
  # ── Application Services ──────────────────────────────────────────────

  gateway:
    init: true
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP: gateway
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - AUTH_SERVICE_HOST=auth
      - AUTH_SERVICE_PORT=50050
      - AUTHORIZATION_SERVICE_HOST=authorization
      - AUTHORIZATION_SERVICE_PORT=50050
      - EXAM_SERVICE_HOST=exam
      - EXAM_SERVICE_PORT=50050
      - FILE_SERVICE_HOST=file-service
      - FILE_SERVICE_PORT=50050
      - ACHIEVEMENT_SERVICE_HOST=achievement
      - ACHIEVEMENT_SERVICE_PORT=50050
      - LIVE_SERVICE_HOST=live
      - LIVE_SERVICE_PORT=50050
      - LIVE_SERVICE_WS_HOST=live
      - LIVE_SERVICE_WS_PORT=1511
      - NOTIFICATION_SERVICE_HOST=notification
      - NOTIFICATION_SERVICE_PORT=50060
      - NOTIFICATION_SERVICE_HTTP_PORT=50061
      - RESOURCE_SERVICE_HOST=resource
      - RESOURCE_SERVICE_PORT=50050
    env_file: .env.services
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 30s
    depends_on: [auth, authorization, exam, file-service, achievement, notification, resource, live]
    networks:
      - api-network

  auth:
    init: true
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP: auth
    environment:
      - POSTGRES_DB=auth_db
      - HOST=0.0.0.0
      - HEALTH_PORT=9101
      - PORT=50050
      - FILE_SERVICE_HOST=file-service
      - FILE_SERVICE_PORT=50050
    env_file: .env.services
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9101/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 30s
    depends_on: [db, redis, rabbit-mq]
    networks:
      - api-network

  authorization:
    init: true
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP: authorization
    environment:
      - POSTGRES_DB=authorization_db
      - HOST=0.0.0.0
      - HEALTH_PORT=9108
      - PORT=50050
    env_file: .env.services
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9108/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 30s
    depends_on: [db, rabbit-mq]
    networks:
      - api-network

  exam:
    init: true
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP: exam
    environment:
      - POSTGRES_DB=exam_db
      - HOST=0.0.0.0
      - HEALTH_PORT=9102
      - PORT=50050
      - FILE_SERVICE_HOST=file-service
      - FILE_SERVICE_PORT=50050
    env_file: .env.services
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9102/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 30s
    depends_on: [db, redis, rabbit-mq]
    networks:
      - api-network

  # Stand-in for the external AI writing scorer (random scores). Opt-in:
  #   docker compose --profile mock-ai up
  # Never run it next to the real scorer: both consume exam.writing.submitted.
  mock-ai-scorer:
    init: true
    profiles: ["mock-ai"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP: mock-ai-scorer
    environment:
      - HOST=0.0.0.0
      - HEALTH_PORT=9110
    env_file: .env.services
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9110/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 30s
    depends_on: [rabbit-mq]
    networks:
      - api-network

  # Real AI writing scorer (profile "ai"). Replaces mock-ai-scorer: never run both, each would
  # score every submission. CPU only: an essay takes about a minute or two.
  ai-llm:
    init: true
    profiles: ["ai"]
    image: ghcr.io/ggml-org/llama.cpp:server-b12004
    # Downloads the fine-tuned Phi-3 GGUF (2.2 GB) into the ai-models volume on first start.
    command:
      - --hf-repo
      - linhma139/Phi-3-IELTS-Scorer
      - --hf-file
      - phi-3-mini-4k-instruct.Q4_K_M.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "4096"
      - --parallel
      - "1"
      - --threads
      - ${AI_LLM_THREADS:-8}
      # The scorer asks for up to 1024 tokens and the model tends to repeat its feedback until it
      # reaches them (~2.5 min on CPU). Cap the answer and discourage repetition.
      - --n-predict
      - "512"
      - --repeat-penalty
      - "1.1"
      - --jinja
    environment:
      - LLAMA_CACHE=/models
    volumes:
      - ai-models:/models
    # leave room for the rest of the stack
    cpus: ${AI_LLM_CPUS:-8}
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 15m
    networks:
      - api-network

  ai-scorer:
    init: true
    profiles: ["ai"]
    build:
      context: ai-scorer
    environment:
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-user}:${RABBITMQ_PASSWORD:-password}@rabbit-mq:5672/
      - LLM_API_URL=http://ai-llm:8080/v1
      - LLM_TIMEOUT=600
      # one essay at a time on CPU: queued essays must not expire while they wait (1 h)
      - MQ_PREFETCH_COUNT=1
      - MQ_MESSAGE_TTL=3600000
      - MQ_MAX_RETRIES=2
    depends_on:
      rabbit-mq:
        condition: service_started
      ai-llm:
        condition: service_healthy
    networks:
      - api-network

  achievement:
    init: true
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP: achievement
    environment:
      - POSTGRES_DB=achievement_db
      - HOST=0.0.0.0
      - HEALTH_PORT=9103
      - PORT=50050
    env_file: .env.services
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9103/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 30s
    depends_on: [db, redis, rabbit-mq]
    networks:
      - api-network

  resource:
    init: true
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP: resource
    environment:
      - POSTGRES_DB=resource_db
      - HOST=0.0.0.0
      - HEALTH_PORT=9104
      - PORT=50050
      - FILE_SERVICE_HOST=file-service
      - FILE_SERVICE_PORT=50050
    env_file: .env.services
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9104/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 30s
    depends_on: [db, redis]
    networks:
      - api-network

  notification:
    init: true
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP: notification
    environment:
      - POSTGRES_DB=notification_db
      - AUTH_SERVICE_HOST=auth
      - AUTH_SERVICE_PORT=50050
      - GRPC_HOST=0.0.0.0
      - GRPC_PORT=50060
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=50061
    env_file: .env.services
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:50061/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 30s
    depends_on: [db, redis, rabbit-mq]
    networks:
      - api-network

  file-service:
    init: true
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP: file-service
    environment:
      - POSTGRES_DB=file_db
      - MINIO_USE_SSL=false
      # Base URL browsers load files from (public URLs and presigned uploads). min-io is only
      # resolvable inside the compose network; set MINIO_PUBLIC_URL in docker/.env when MinIO is
      # served on a public host (e.g. behind the same reverse proxy as the API).
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9000}
      - HOST=0.0.0.0
      - HEALTH_PORT=9106
      - PORT=50050
    env_file: .env.services
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9106/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 30s
    depends_on: [db, redis, rabbit-mq, min-io]
    networks:
      - api-network

  live:
    init: true
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP: live
    environment:
      - POSTGRES_DB=live_db
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=1511
      - GRPC_HOST=0.0.0.0
      - GRPC_PORT=50050
      - AUTH_SERVICE_HOST=auth
      - AUTH_SERVICE_PORT=50050
    env_file: .env.services
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:1511/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 30s
    depends_on: [db, redis, rabbit-mq]
    networks:
      - api-network

  # ── Envoy Sidecars ────────────────────────────────────────────────────

  envoy-gateway:
    build:
      context: .
      dockerfile: Dockerfile.envoy
    ports:
      - "${ENVOY_GATEWAY_PORT:-8080}:8080"
      - "${ENVOY_GATEWAY_ADMIN_PORT:-9900}:9900"
    volumes:
      - ./envoy/gateway.yaml:/tmpl/envoy.yaml
    environment:
      - LISTEN_PORT=8080
      - ADMIN_PORT=9900
      - BACKEND_HOST=gateway
      - BACKEND_PORT=3000
    command: >
      sh -c 'envsubst < /tmpl/envoy.yaml > /tmp/envoy.yaml
      && envoy -c /tmp/envoy.yaml'
    depends_on: [gateway]
    networks:
      - api-network

  envoy-auth:
    build:
      context: .
      dockerfile: Dockerfile.envoy
    ports:
      - "${ENVOY_AUTH_PORT:-8081}:8081"
    volumes:
      - ./envoy/auth.yaml:/tmpl/envoy.yaml
    environment:
      - LISTEN_PORT=8081
      - ADMIN_PORT=9901
      - BACKEND_HOST=auth
      - BACKEND_PORT=50050
    command: >
      sh -c 'envsubst < /tmpl/envoy.yaml > /tmp/envoy.yaml
      && envoy -c /tmp/envoy.yaml'
    depends_on: [auth]
    networks:
      - api-network

  envoy-exam:
    build:
      context: .
      dockerfile: Dockerfile.envoy
    ports:
      - "${ENVOY_EXAM_PORT:-8082}:8082"
    volumes:
      - ./envoy/exam.yaml:/tmpl/envoy.yaml
    environment:
      - LISTEN_PORT=8082
      - ADMIN_PORT=9902
      - BACKEND_HOST=exam
      - BACKEND_PORT=50050
    command: >
      sh -c 'envsubst < /tmpl/envoy.yaml > /tmp/envoy.yaml
      && envoy -c /tmp/envoy.yaml'
    depends_on: [exam]
    networks:
      - api-network

  envoy-achievement:
    build:
      context: .
      dockerfile: Dockerfile.envoy
    ports:
      - "${ENVOY_ACHIEVEMENT_PORT:-8083}:8083"
    volumes:
      - ./envoy/achievement.yaml:/tmpl/envoy.yaml
    environment:
      - LISTEN_PORT=8083
      - ADMIN_PORT=9903
      - BACKEND_HOST=achievement
      - BACKEND_PORT=50050
    command: >
      sh -c 'envsubst < /tmpl/envoy.yaml > /tmp/envoy.yaml
      && envoy -c /tmp/envoy.yaml'
    depends_on: [achievement]
    networks:
      - api-network

  envoy-resource:
    build:
      context: .
      dockerfile: Dockerfile.envoy
    ports:
      - "${ENVOY_RESOURCE_PORT:-8084}:8084"
    volumes:
      - ./envoy/resource.yaml:/tmpl/envoy.yaml
    environment:
      - LISTEN_PORT=8084
      - ADMIN_PORT=9904
      - BACKEND_HOST=resource
      - BACKEND_PORT=50050
    command: >
      sh -c 'envsubst < /tmpl/envoy.yaml > /tmp/envoy.yaml
      && envoy -c /tmp/envoy.yaml'
    depends_on: [resource]
    networks:
      - api-network

  envoy-notification:
    build:
      context: .
      dockerfile: Dockerfile.envoy
    ports:
      - "${ENVOY_NOTIFICATION_GRPC_PORT:-8085}:8085"
      - "${ENVOY_NOTIFICATION_SSE_PORT:-8095}:8095"
    volumes:
      - ./envoy/notification.yaml:/tmpl/envoy.yaml
    environment:
      - LISTEN_PORT=8085
      - SSE_LISTEN_PORT=8095
      - ADMIN_PORT=9905
      - BACKEND_HOST=notification
      - BACKEND_PORT=50060
      - SSE_BACKEND_PORT=50061
    command: >
      sh -c 'envsubst < /tmpl/envoy.yaml > /tmp/envoy.yaml
      && envoy -c /tmp/envoy.yaml'
    depends_on: [notification]
    networks:
      - api-network

  envoy-file-service:
    build:
      context: .
      dockerfile: Dockerfile.envoy
    ports:
      - "${ENVOY_FILE_SERVICE_PORT:-8086}:8086"
    volumes:
      - ./envoy/file-service.yaml:/tmpl/envoy.yaml
    environment:
      - LISTEN_PORT=8086
      - ADMIN_PORT=9906
      - BACKEND_HOST=file-service
      - BACKEND_PORT=50050
    command: >
      sh -c 'envsubst < /tmpl/envoy.yaml > /tmp/envoy.yaml
      && envoy -c /tmp/envoy.yaml'
    depends_on: [file-service]
    networks:
      - api-network

  envoy-live:
    build:
      context: .
      dockerfile: Dockerfile.envoy
    ports:
      - "${ENVOY_LIVE_GRPC_PORT:-8087}:8087"
      - "${ENVOY_LIVE_WS_PORT:-8088}:8088"
    volumes:
      - ./envoy/live.yaml:/tmpl/envoy.yaml
    environment:
      - LISTEN_PORT=8087
      - WS_LISTEN_PORT=8088
      - ADMIN_PORT=9907
      - BACKEND_HOST=live
      - GRPC_BACKEND_PORT=50050
      - WS_BACKEND_PORT=1511
    command: >
      sh -c 'envsubst < /tmpl/envoy.yaml > /tmp/envoy.yaml
      && envoy -c /tmp/envoy.yaml'
    depends_on: [live]
    networks:
      - api-network
