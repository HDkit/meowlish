# Grafana LGTM (Loki, Grafana, Tempo, Mimir/Prometheus) + OpenTelemetry collector.
# Apps send OTLP to http://lgtm:4318 (in compose) or http://localhost:${LGTM_OTLP_HTTP_PORT} (nx serve).
# Start next to the main stack so the apps can resolve `lgtm`:
#   docker compose -f docker/docker-compose.observability.yaml up -d
# Both files declare `name: meowlish`, so they share the `meowlish_api-network` network.
name: meowlish

services:
  lgtm:
    image: grafana/otel-lgtm:0.38.1
    restart: unless-stopped
    ports:
      - '${INFRA_BIND_ADDRESS:-127.0.0.1}:${LGTM_GRAFANA_PORT:-3001}:3000'
      - '${INFRA_BIND_ADDRESS:-127.0.0.1}:${LGTM_OTLP_GRPC_PORT:-4317}:4317'
      - '${INFRA_BIND_ADDRESS:-127.0.0.1}:${LGTM_OTLP_HTTP_PORT:-4318}:4318'
    volumes:
      - lgtm-data:/data
      # Single-file mounts: the provisioning dirs already hold the image's own providers/samples.
      - ./observability/dashboards/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/meowlish-dashboards.yaml:ro
      - ./observability/dashboards/platform-status.json:/otel-lgtm/meowlish-dashboards/platform-status.json:ro
      - ./observability/alerting/platform.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/meowlish-platform.yaml:ro
      - ./observability/dashboards/messaging.json:/otel-lgtm/meowlish-dashboards/messaging.json:ro
      - ./observability/alerting/messaging.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/meowlish-messaging.yaml:ro
      - ./observability/otelcol-rabbitmq.yaml:/otel-lgtm/otelcol-rabbitmq.yaml:ro
    environment:
      # Extra collector config merged over the image's own (scrapes RabbitMQ queue metrics).
      OTELCOL_EXTRA_ARGS: --config=file:/otel-lgtm/otelcol-rabbitmq.yaml
    networks:
      - api-network

networks:
  # Same network as the app stack (compose project `meowlish`) so `lgtm` resolves from the apps.
  api-network:
    driver: bridge

volumes:
  lgtm-data:
